name: Auto Video Pipeline
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [new-video-row]
jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cai Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cai FFmpeg va Font (khong dung apt, tranh mirror Azure hay treo)
        timeout-minutes: 3
        run: |
          set -e

          # ---- FFmpeg: neu runner da co san thi bo qua, khong thi tai static build ----
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            echo "Da co san ffmpeg: $(ffmpeg -version | head -n1)"
          else
            echo "Tai ffmpeg static build tu GitHub (khong qua apt/mirror Ubuntu)..."
            curl -sSL --connect-timeout 10 --max-time 90 --retry 3 --retry-delay 2 \
              -o /tmp/ffmpeg.tar.xz \
              "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz"
            mkdir -p /tmp/ffmpeg-extract
            tar -xf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg-extract --strip-components=1
            sudo mv /tmp/ffmpeg-extract/ffmpeg /tmp/ffmpeg-extract/ffprobe /usr/local/bin/
            sudo chmod +x /usr/local/bin/ffmpeg /usr/local/bin/ffprobe
            echo "Da cai xong: $(ffmpeg -version | head -n1)"
          fi

          # ---- Font DejaVu: main.py can dung fontfile tai duong dan co dinh nay ----
          FONT_DIR="/usr/share/fonts/truetype/dejavu"
          FONT_FILE="$FONT_DIR/DejaVuSans-Bold.ttf"
          if [ -f "$FONT_FILE" ]; then
            echo "Da co san font DejaVu tai $FONT_FILE"
          else
            echo "Tai font DejaVu Sans Bold truc tiep tu GitHub..."
            sudo mkdir -p "$FONT_DIR"
            curl -sSL --connect-timeout 10 --max-time 60 --retry 3 --retry-delay 2 \
              -o /tmp/DejaVuSans-Bold.ttf \
              "https://raw.githubusercontent.com/dejavu-fonts/dejavu-fonts/master/ttf/DejaVuSans-Bold.ttf"
            sudo mv /tmp/DejaVuSans-Bold.ttf "$FONT_FILE"
            sudo fc-cache -f "$FONT_DIR"
            echo "Da cai xong font."
          fi

      - name: Cai thu vien Python
        run: pip install -r requirements.txt

      - name: Tao file service_account.json tu Secret
        run: echo '${{ secrets.GCP_SERVICE_ACCOUNT }}' > service_account.json

      - name: Chay script chinh
        env:
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_REFRESH_TOKEN: ${{ secrets.OAUTH_REFRESH_TOKEN }}
        run: python main.py
