name: Auto Video Pipeline
on:
  workflow_dispatch:
  repository_dispatch:
    types: [new-video-row]
jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cai Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cai FFmpeg va Font (khong dung apt, tranh mirror Azure hay treo)
        timeout-minutes: 3
        run: |
          set -e

          # ---- FFmpeg: neu runner da co san (VA co filter drawtext) thi bo qua ----
          # Luu y: build "static" cua johnvansickle.com KHONG kem filter drawtext
          # (main.py can drawtext de in chu lien he), nen dung bang BtbN (GPL build)
          # thay vi bang static toi gian.
          can_dung_ffmpeg_co_san=false
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            if ffmpeg -hide_banner -filters 2>/dev/null | grep -qi drawtext; then
              can_dung_ffmpeg_co_san=true
            fi
          fi

          if [ "$can_dung_ffmpeg_co_san" = true ]; then
            echo "Da co san ffmpeg (co drawtext): $(ffmpeg -version | head -n1)"
          else
            echo "Tai ffmpeg build BtbN (GPL, co drawtext+libx264+subtitles) tu GitHub..."
            curl -sSL --connect-timeout 10 --max-time 180 --retry 3 --retry-delay 2 \
              -o /tmp/ffmpeg.tar.xz \
              "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz"
            mkdir -p /tmp/ffmpeg-extract
            tar -xf /tmp/ffmpeg.tar.xz -C /tmp/ffmpeg-extract --strip-components=1
            sudo mv /tmp/ffmpeg-extract/bin/ffmpeg /tmp/ffmpeg-extract/bin/ffprobe /usr/local/bin/
            sudo chmod +x /usr/local/bin/ffmpeg /usr/local/bin/ffprobe
            echo "Da cai xong: $(ffmpeg -version | head -n1)"
            ffmpeg -hide_banner -filters 2>/dev/null | grep -qi drawtext \
              && echo "Xac nhan: co filter drawtext" \
              || (echo "LOI: van khong co filter drawtext sau khi cai" && exit 1)
          fi

          # ---- Font DejaVu: main.py can dung fontfile tai duong dan co dinh nay ----
          FONT_DIR="/usr/share/fonts/truetype/dejavu"
          FONT_FILE="$FONT_DIR/DejaVuSans-Bold.ttf"
          if [ -f "$FONT_FILE" ]; then
            echo "Da co san font DejaVu tai $FONT_FILE"
          else
            echo "Tai font DejaVu Sans Bold truc tiep tu GitHub..."
            sudo mkdir -p "$FONT_DIR"
            curl -sSL --connect-timeout 10 --max-time 60 --retry 3 --retry-delay 2 \
              -o /tmp/DejaVuSans-Bold.ttf \
              "https://raw.githubusercontent.com/dejavu-fonts/dejavu-fonts/master/ttf/DejaVuSans-Bold.ttf"
            sudo mv /tmp/DejaVuSans-Bold.ttf "$FONT_FILE"
            sudo fc-cache -f "$FONT_DIR"
            echo "Da cai xong font."
          fi

      # espeak-ng can cho VieNeu. Dung apt nen de rieng, gioi han 3 phut, loi/treo thi bo qua
      # (luc do VieNeu co the loi va he thong tu chuyen sang Piper, Piper tu mang theo espeak).
      - name: Cai espeak-ng cho VieNeu (co gioi han thoi gian)
        timeout-minutes: 3
        continue-on-error: true
        run: |
          if command -v espeak-ng >/dev/null 2>&1; then
            echo "Da co san espeak-ng"
          else
            sudo apt-get update
            sudo apt-get install -y espeak-ng
          fi

      - name: Cai thu vien Python (luon ban moi nhat de tranh loi 403 edge-tts)
        run: pip install -U -r requirements.txt

      - name: Luu cache model giong doc (do tai lai moi lan)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-v2

      - name: Tai model VieNeu va go symlink (tranh loi onnxruntime)
        continue-on-error: true
        run: |
          python -c "from vieneu import Vieneu; Vieneu()" || true
          find ~/.cache/huggingface/hub -type l | while read -r f; do
            cp --remove-destination "$(readlink -f "$f")" "$f"
          done

      - name: Tai giong Piper (du phong mien phi, khong can key)
        continue-on-error: true
        run: |
          mkdir -p piper_models
          B=https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/vi/vi_VN/vais1000/medium
          curl -L --fail --retry 3 -o piper_models/vi.onnx "$B/vi_VN-vais1000-medium.onnx"
          curl -L --fail --retry 3 -o piper_models/vi.onnx.json "$B/vi_VN-vais1000-medium.onnx.json"
          ls -la piper_models

      - name: Tao file service_account.json tu Secret
        run: echo '${{ secrets.GCP_SERVICE_ACCOUNT }}' > service_account.json

      - name: Chay script chinh
        env:
          OAUTH_CLIENT_ID: ${{ secrets.OAUTH_CLIENT_ID }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          OAUTH_REFRESH_TOKEN: ${{ secrets.OAUTH_REFRESH_TOKEN }}
        run: python main.py
